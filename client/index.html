<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IronGate — Smart Gym Reception</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>IRONGATE <span class="badge">RECEPTION OS</span></h1>
      <p>Live Cloud Member Registry & Automated Turnstile Control</p>
    </header>

    <div id="gateBanner" class="gate-banner hidden"></div>

    <section class="card">
      <h2>Register New Member</h2>
      <div class="form-row">
        <input id="nameInput" type="text" placeholder="Member Full Name (e.g. Virat)" />
        <select id="planInput">
          <option value="Monthly Pro">Monthly Pro</option>
          <option value="Quarterly Elite">Quarterly Elite</option>
          <option value="Annual Titan">Annual Titan</option>
          <option value="Expired">Expired</option>
        </select>
        <input type="number" id="daysInput" placeholder="Days Left (e.g. 30)" />
        <button id="addBtn" onclick="addMember()">+ Register Member</button>
      </div>
    </section>

    <section class="card">
      <div class="scoreboard-header">
        <h2>Live Member Board</h2>
        <button id="refreshBtn" class="refresh-btn" type="button">Refresh</button>
      </div>
      <div id="memberList"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
